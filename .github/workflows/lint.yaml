name: lint

on: [workflow_call]

jobs:
  lint:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        os: [ubuntu-22.04]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - uses: Gr1N/setup-poetry@v8
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: ${{ runner.os }}-poetry-lint-${{ hashFiles('poetry.lock') }}
      - name: Install project
        run: poetry sync --no-interaction --with=lint
      # The same checks as the pre-commit hooks: codespell, ruff check, ruff format and pyright.
      - name: Run checks on Python ${{ matrix.python-version }}
        run: poetry run pre-commit run --all-files --show-diff-on-failure
