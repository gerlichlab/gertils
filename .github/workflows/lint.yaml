name: lint

on: [workflow_call]

jobs:
  lint:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        os: [ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      # The environment goes in the checkout, at one path on every OS, for the cache
      # below; Poetry's own cache folder differs between them.
      POETRY_VIRTUALENVS_IN_PROJECT: "true"

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        id: setup-python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - uses: Gr1N/setup-poetry@v8
      - uses: actions/cache@v4
        with:
          path: .venv
          # Each Python has an environment of its own, keyed on the full version: an
          # environment points at the Python that made it, which the runner drops when
          # its image moves to the next patch release.
          key: ${{ runner.os }}-poetry-lint-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('poetry.lock') }}
      - name: Install project
        run: poetry sync --no-interaction --with=lint
      # The same checks as the pre-commit hooks: codespell, ruff check, ruff format and pyright.
      # Only pyright depends on the Python it runs on, so the others run on the lowest only.
      - name: Run checks on Python ${{ matrix.python-version }}
        env:
          SKIP: ${{ matrix.python-version != '3.12' && 'codespell,ruff-check,ruff-format' || '' }}
        run: poetry run pre-commit run --all-files --show-diff-on-failure
