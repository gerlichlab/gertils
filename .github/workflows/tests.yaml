name: Tests 

on: [workflow_call]

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # The environment goes in the checkout, at one path on every OS, for the cache
      # below; Poetry's own cache folder differs between them.
      POETRY_VIRTUALENVS_IN_PROJECT: "true"

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        id: setup-python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - uses: Gr1N/setup-poetry@v8
      - uses: actions/cache@v4
        with:
          path: .venv
          # Each Python has an environment of its own, keyed on the full version: an
          # environment points at the Python that made it, which the runner drops when
          # its image moves to the next patch release.
          key: ${{ runner.os }}-poetry-tests-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('poetry.lock') }}
      - name: Install project
        run: poetry sync --no-interaction --with test
      - name: Run unit tests on Python ${{ matrix.python-version }}
        run: poetry run pytest -vv
